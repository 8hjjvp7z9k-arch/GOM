<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GOM · Mẫu thử</title>
<meta name="description" content="Mẫu thử tương tác GOM (Mẫu A, B, C): ghi chú chi tiêu nhanh sau thanh toán và cảnh báo hạn mức cho sinh viên. Nhóm 2 RE:SMART, Tư duy thiết kế UEH.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
/* A1 poster (594 x 841 mm = 2245 x 3179 CSS px at 96 dpi), drawn 1:1 and scaled to the viewport on screen.
   Palette kept from the group's printed poster: blue gradient wall, white cards with navy outline and pill tabs. */
:root{
  --sky:#3b93f2; --royal:#1c3fd0; --deep:#0a1a8c;
  --navy:#0b0b6b; --indigo:#2b2bd6; --ink:#16163f; --muted:#4f5480;
  --soft:#eef4ff; --line:#c9d6f5;
  --leaf:#4f8a3f; --root:#a62631; --core:#f0912f;
  --cream:#fbe9a8; --mint:#d5e3dd; --rose:#e8d9d9;
  --teal:#5bb5c8; --lime:#a4c639; --orange:#f0a050;
  --red:#d1102b; --app-bg:#f1f1f6; --app-ink:#1c1c22; --app-mute:#6c6c78;
  --kscol:#0f7a8c; --kscbg:#dcf3f6;
  --font-display:'Baloo 2','Be Vietnam Pro',system-ui,sans-serif;
  --font-body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#060d45;color:var(--ink);font-family:var(--font-body);-webkit-print-color-adjust:exact;print-color-adjust:exact}
h1,h2,h3,h4,p,ul,ol,dl,dd{margin:0}
ul,ol{padding-left:1.1em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid #ffd35c;outline-offset:2px}

/* ---------- viewer chrome (screen only) ---------- */
.bar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 16px;background:rgba(6,13,69,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;border-bottom:1px solid rgba(255,255,255,.15)}
.bar b{font-size:14px;margin-right:auto;letter-spacing:.02em}
.bar button{border:1.5px solid rgba(255,255,255,.5);background:none;color:#fff;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600}
.bar button.on{background:#fff;color:var(--navy)}
.bar .go{background:linear-gradient(#fff6d8,#ffd35c);color:var(--navy);border-color:#ffd35c;font-weight:800}
.viewer{overflow:auto;padding:16px}
.sizer{margin:0 auto;position:relative}
.sheet{position:absolute;left:0;top:0;transform-origin:0 0;width:2245px;height:3179px;overflow:hidden;
  background:linear-gradient(180deg,var(--sky) 0,var(--royal) 30%,var(--deep) 100%);background-color:var(--royal);
  padding:48px 56px 0;font-size:23px;line-height:1.42}

/* ---------- header ---------- */
.head{display:grid;grid-template-columns:minmax(0,1fr) 700px 226px;gap:36px;align-items:start;color:#fff;height:240px}
.eyebrow{display:inline-block;font-size:19px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;padding:5px 18px;border:2px solid rgba(255,255,255,.65);border-radius:999px}
.logo{display:flex;align-items:flex-end;gap:28px;margin-top:10px}
.logo h1{font-family:var(--font-display);font-weight:800;font-size:196px;line-height:.78;letter-spacing:-.02em;padding-top:26px}
.logo p{font-family:var(--font-display);font-weight:700;font-size:44px;line-height:1.08;max-width:15ch;padding-bottom:6px}
.team{border:2px solid rgba(255,255,255,.45);border-radius:26px;padding:16px 22px;background:rgba(255,255,255,.08)}
.team .t1{font-family:var(--font-display);font-weight:800;font-size:34px;line-height:1.1}
.team .t2{font-size:20px;font-weight:600;margin-top:2px}
.team ul{list-style:none;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:0 18px;font-size:17px;line-height:1.45;margin-top:8px;opacity:.95}
.qrcard{background:#fff;border-radius:22px;padding:10px 10px 8px;color:var(--navy);text-align:center;margin-top:-22px}
.qrcard svg{display:block;width:100%;height:auto}
.qrcard b{display:block;font-size:16.5px;line-height:1.2;margin-top:6px}

/* ---------- evidence band ---------- */
.evid{margin-top:16px;height:212px;display:grid;grid-template-columns:330px minmax(0,1fr);gap:26px;align-items:stretch;color:#fff;border:2px solid rgba(255,255,255,.45);border-radius:28px;padding:18px 24px;background:rgba(255,255,255,.1)}
.src h2{font-size:16px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;margin-bottom:5px}
.src div{font-size:15.5px;line-height:1.22;margin-bottom:5px}
.src div b{display:block;font-size:18.5px}
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:20px}
.stat{border-left:2px solid rgba(255,255,255,.35);padding-left:14px;display:grid;grid-template-columns:58px minmax(0,1fr);column-gap:12px;align-content:start}
.stat .ring{grid-row:1/4;width:58px;height:58px;margin-top:4px}
.stat .ring circle{fill:none;stroke-width:9}
.stat b{display:block;font-family:var(--font-display);font-size:52px;line-height:1;font-weight:800}
.stat span{display:block;font-size:16.5px;line-height:1.28;margin-top:4px}
.stat i{display:inline-block;font-style:normal;font-size:14.5px;font-weight:700;margin-top:6px;padding:1px 10px;border-radius:999px;background:rgba(255,255,255,.2)}
.evnote{grid-column:1/-1;font-size:15.5px;opacity:.95;display:flex;gap:26px;flex-wrap:wrap;align-items:center;margin-top:-4px}
.evnote span{display:inline-flex;align-items:center;gap:8px}

/* ---------- cards ---------- */
.row{display:grid;gap:52px;margin-top:43px}
.r1,.r2{grid-template-columns:1040px minmax(0,1fr)}
.r1{height:650px}.r2{height:630px}
.r3,.r4{grid-template-columns:1040px minmax(0,1fr)}
.r3{height:574px}.r4{height:552px}
.col{display:flex;flex-direction:column;gap:46px;min-height:0}
.card{position:relative;background:#fff;border:4px solid var(--navy);border-radius:34px;padding:46px 28px 22px;min-height:0}
.tab{position:absolute;left:20px;top:-33px;display:flex;align-items:center;z-index:2}
.tab .num{position:relative;z-index:1;width:62px;height:62px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:36px;line-height:1;padding-bottom:3px}
.tab .label{margin:0 0 0 -16px;padding:4px 32px 2px 30px;border:3px solid var(--navy);border-radius:999px;background:#fff;color:var(--navy);font-family:var(--font-display);font-weight:800;font-size:32px;line-height:1.25;letter-spacing:.01em}
.tab .label b{color:var(--root);font-weight:800}
.card h3{font-size:20px;letter-spacing:.06em;text-transform:uppercase;font-weight:800;color:var(--navy);margin-bottom:4px}
.fn{font-size:16.5px;line-height:1.35;color:var(--muted)}

/* evidence chips: PV = interview, KS = survey, LT = literature */
.ev{display:inline-block;margin-left:6px;padding:0 10px;border-radius:999px;background:#e1e6ff;color:var(--indigo);font-size:15px;font-weight:700;line-height:1.6;white-space:nowrap;vertical-align:2px}
.ev.ks{background:var(--kscbg);color:var(--kscol)}
.ev.lt{background:#f3e8ff;color:#6a2c9c}
.ev.na{background:none;border:1.5px dashed #8b90b8;color:#5a5f88;font-weight:600}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;background:#fff}
.dot.hol{background:transparent;border:2px dashed #fff}

/* persona */
.persona{display:grid;grid-template-columns:330px minmax(0,1fr);gap:28px;height:calc(100% - 34px)}
.pl{display:flex;flex-direction:column;align-items:center;gap:10px}
.avatar{width:150px;height:150px;border-radius:50%;background:linear-gradient(#cfe4ff,#8fb8f5);display:grid;place-items:end center;overflow:hidden;border:4px solid var(--navy);flex:none}
.pname{font-family:var(--font-display);font-weight:800;font-size:46px;line-height:1;color:var(--navy)}
.psub{font-size:18px;font-weight:600;color:var(--muted);margin-top:-4px;text-align:center}
.idcard{width:100%;background:linear-gradient(160deg,#2331c4,#17208f);color:#fff;border-radius:22px;padding:14px 16px}
.idcard dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:18px;line-height:1.3}
.idcard dt{font-weight:700;opacity:.85}
.idcard dd{font-weight:700}
.idcard .ev{margin:3px 0 0;display:inline-block}
.pr{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto 1fr;gap:12px 24px;min-width:0;font-size:20.5px;line-height:1.36}
.pr li{margin-bottom:4px}
.quote{grid-column:1/-1;align-self:end;background:var(--cream);border-radius:18px;padding:12px 18px;font-size:21px;line-height:1.38;font-weight:600;color:var(--navy)}
.quote small{display:block;font-weight:600;font-size:15.5px;color:var(--muted);margin-top:2px}

/* empathy */
.emp{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px;height:100%}
.map{position:relative;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;border:2.5px dashed #b9a67a;border-radius:22px;overflow:hidden}
.q{padding:12px 14px;font-size:18.5px;line-height:1.33;min-width:0}
.q:nth-child(1){border-right:2.5px dashed #b9a67a;border-bottom:2.5px dashed #b9a67a}
.q:nth-child(2){border-bottom:2.5px dashed #b9a67a}
.q:nth-child(3){border-right:2.5px dashed #b9a67a}
.q .chip{display:inline-block;background:var(--cream);color:var(--ink);font-weight:800;font-size:17px;padding:2px 16px;border-radius:999px;margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.q li{margin-bottom:4px}
.q .ev{font-size:13.5px;margin-left:4px}
.q .fn{font-size:14.5px;margin-top:4px}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:92px;height:92px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:24px;border:5px solid #fff}
.pg{display:flex;flex-direction:column;gap:14px}
.pain,.gain{border-radius:18px;padding:12px 16px;font-size:18.5px;line-height:1.33;flex:1;position:relative}
.pain{background:var(--mint)}
.gain{background:var(--rose)}
.pain h4,.gain h4{font-family:var(--font-display);font-size:28px;line-height:1.1;color:var(--ink);margin-bottom:4px;text-transform:uppercase}
.pain li,.gain li{margin-bottom:4px}
.pain .ev,.gain .ev{font-size:13.5px;margin-left:4px}
.face{position:absolute;right:12px;top:10px;width:40px;height:40px}

/* tree */
.tree{display:flex;flex-direction:column;gap:8px}
.tier{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;align-items:center}
.tl{background:linear-gradient(135deg,#3f55e6,#1f2fb8);color:#fff;font-family:var(--font-display);font-weight:800;font-size:28px;line-height:1;border-radius:999px;padding:10px 8px 8px;text-align:center}
.tl small{display:block;font-family:var(--font-body);font-weight:600;font-size:13.5px;line-height:1.2;margin-top:2px}
.nodes{display:grid;gap:10px}
.n4{grid-template-columns:repeat(4,minmax(0,1fr))}
.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
.node{border-radius:22px;padding:10px 12px;color:#fff;font-weight:700;font-size:20px;line-height:1.25;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:100px}
.node.leaf{background:var(--leaf)}
.node.root{background:var(--root)}
.node .ev{margin:0;background:rgba(255,255,255,.95);font-size:13.5px;line-height:1.5;white-space:normal}
.node .ev.ks{color:var(--kscol)}
.core{background:var(--core);color:var(--ink);border-radius:22px;padding:18px 22px;text-align:center;font-weight:800;font-size:24px;line-height:1.25}
.core .ev{background:#fff;font-size:14.5px}
.flow{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;color:var(--navy);font-size:16px;font-weight:700}
.flow div{display:flex;align-items:center;justify-content:center;gap:10px}
.flow svg{width:26px;height:26px}
.tree .fn{margin-top:4px}

/* fishbone */
.fish{display:block;width:100%;height:auto}
.fishnote{display:flex;gap:24px;flex-wrap:wrap;font-size:16px;color:var(--muted);margin-top:6px}
.fishnote span{display:inline-flex;align-items:center;gap:8px}
.fishnote .dot{background:var(--indigo)}
.fishnote .dot.hol{background:transparent;border-color:#8b90b8}

/* problem statement */
.psq{font-size:26.5px;line-height:1.34;font-weight:700;color:var(--indigo);text-wrap:pretty;border-left:8px solid var(--core);padding-left:22px}
.psparts{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 14px 30px;font-size:16px}
.psparts span{background:var(--soft);border:1.5px solid var(--line);border-radius:999px;padding:2px 14px;color:var(--navy)}
.psparts b{font-weight:800}
.hmw{width:100%;border-collapse:separate;border-spacing:0 5px;font-size:17px;line-height:1.27}
.hmw td{padding:6px 12px;vertical-align:middle;background:var(--soft)}
.hmw td:first-child{border-radius:14px 0 0 14px;width:48%}
.hmw td:last-child{border-radius:0 14px 14px 0}
.hmw .k{font-family:var(--font-display);font-weight:800;color:var(--navy);font-size:22px;margin-right:6px}
.hmw .arrow{width:34px;text-align:center;color:var(--core);font-weight:800;font-size:26px;background:var(--soft)}
.hmw .ev{font-size:13.5px}

/* prototype */
.proto{display:grid;grid-template-columns:426px minmax(0,1fr);gap:24px;height:100%}
.pbox{position:relative;width:426px;height:872px}
.pbox .phone{position:absolute;left:0;top:0;transform:scale(1.217);transform-origin:0 0}
.side{display:flex;flex-direction:column;gap:12px;min-width:0;font-size:17.5px;line-height:1.33}
.side h3{font-size:16.5px}
.abt{display:grid;gap:8px}
.abt button{border:2.5px solid var(--line);background:#fff;border-radius:16px;padding:7px 12px;text-align:left;font-size:16px;line-height:1.25;color:var(--navy)}
.abt button b{display:block;font-size:17px}
.abt button.on{border-color:var(--navy);background:var(--soft);box-shadow:inset 0 0 0 1.5px var(--navy)}
.steps{padding-left:1.15em}
.steps li{margin-bottom:3px}
.sim{border:2.5px solid var(--navy);background:linear-gradient(#fff6d8,#ffd35c);color:var(--navy);font-weight:800;font-size:17px;border-radius:999px;padding:10px 14px;width:100%}
.sim2{display:flex;gap:8px}
.sim2 button{flex:1;border:2px solid var(--line);background:#fff;color:var(--navy);font-weight:700;font-size:14.5px;border-radius:999px;padding:6px 8px}
.feat{display:grid;gap:6px}
.feat button{display:block;text-align:left;background:var(--soft);border:2px solid var(--line);border-radius:14px;padding:6px 10px;font-size:15px;line-height:1.3;color:var(--ink)}
.feat button:hover{border-color:var(--indigo);background:#fff}
.feat b{font-size:16px;color:var(--navy)}
.feat .ev{font-size:12.5px;margin-left:4px;vertical-align:1px}
.printnote{display:none}
.pnote{font-size:17px;line-height:1.3;color:var(--navy);font-weight:600;margin-bottom:10px}
.shots{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.shot{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;color:var(--ink)}
.shot img{height:286px;width:auto;display:block;border-radius:26px;filter:drop-shadow(0 6px 10px rgba(5,10,80,.25))}
.shot:hover img{outline:4px solid #ffd35c;outline-offset:2px}
.shot .cap{font-size:14.5px;line-height:1.22}
.shot .cap b{display:block;font-size:15px;color:var(--navy)}
.shot .ev{font-size:12.5px;margin:2px 2px 0}
.ptools{display:flex;gap:10px;margin:12px 0 8px}
.ptools .sim{flex:1;width:auto}
.sim3{border:2.5px solid var(--navy);background:#fff;color:var(--navy);font-weight:800;font-size:17px;border-radius:999px;padding:10px 18px}

/* test */
.tstate{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:6px;font-size:15.5px;line-height:1.3}
.pill{display:inline-block;background:#fff4d6;border:2px solid #f0c75a;color:#7a5200;font-weight:800;font-size:16px;padding:2px 14px;border-radius:999px;white-space:nowrap}
.pill.ok{background:#e3f4df;border-color:#7cbf6e;color:#2c6a20}
table.tt{border-collapse:collapse;width:100%;font-size:15.5px;line-height:1.28}
.tt th,.tt td{border:1.5px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.tt th{background:var(--soft);color:var(--navy);font-weight:800;font-size:15.5px}
.tt td:first-child{font-weight:800;color:var(--navy);white-space:nowrap}
.tt button{border:0;background:none;color:var(--indigo);font-weight:800;text-decoration:underline;padding:0;font-size:inherit}
.tmeta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;font-size:15px;line-height:1.3}
.tmeta div{background:var(--soft);border-radius:14px;padding:8px 12px}
.tmeta b{color:var(--navy)}

/* value proposition canvas */
.vpc{display:grid;grid-template-columns:minmax(0,1fr) 46px minmax(0,1fr);gap:8px 0;align-items:stretch}
.vh{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;font-size:20.5px;line-height:1.1;color:var(--navy)}
.vh svg{width:34px;height:34px;flex:none}
.vb{padding:9px 14px 9px;font-size:17.5px;line-height:1.3;min-width:0}
.vb h4{font-size:16px;letter-spacing:.06em;text-transform:uppercase;font-weight:800;margin-bottom:3px}
.vb ul{padding-left:1.05em}.vb li{margin-bottom:2px}
.vb .ev{font-size:12.5px;margin-left:4px;vertical-align:1px}
.vb.vm{border-radius:10px}
.vb.cp{border-radius:44px;padding-left:24px;padding-right:20px}
.vb.g{background:#e3f2df}.vb.g h4{color:#2c6a20}
.vb.p{background:#fbe3e1}.vb.p h4{color:#9d2a22}
.vb.j{background:var(--soft)}.vb.j h4{color:var(--navy)}
.fit{display:grid;place-items:center;color:var(--core)}
.fit svg{width:34px;height:34px}
.vfoot{grid-column:1/-1;font-size:15.5px;color:var(--navy);font-weight:600;margin-top:2px}

/* test results */
.tgrid{display:grid;grid-template-columns:minmax(0,1.18fr) minmax(0,1fr);gap:22px;margin-top:4px}
.tgrid h3{font-size:15px;margin-bottom:6px;line-height:1.25}
.lk{display:grid;grid-template-columns:168px minmax(0,1fr) 50px;gap:6px 10px;align-items:center;font-size:15.5px}
.lk .nm{font-weight:700;color:var(--ink);line-height:1.15}
.lk .mean{font-family:var(--font-display);font-weight:800;font-size:23px;color:var(--navy);text-align:right;line-height:1}
.sbar{display:flex;height:30px;gap:2px}
.sbar i{display:grid;place-items:center;font-style:normal;font-size:14px;font-weight:800;color:var(--navy);min-width:0}
.sbar i:first-child{border-radius:6px 0 0 6px}.sbar i:last-child{border-radius:0 6px 6px 0}
.sbar i.dk{color:#fff}
.lkleg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13.5px;color:var(--muted);margin-top:6px;align-items:center}
.lkleg span{display:inline-flex;align-items:center;gap:5px}
.lkleg b{display:inline-block;width:14px;height:14px;border-radius:3px}
.thr{display:inline-block;margin-top:8px;background:#e3f4df;border:2px solid #7cbf6e;color:#2c6a20;font-weight:800;font-size:14.5px;padding:2px 12px;border-radius:999px}
.mini{display:flex;flex-direction:column;gap:12px}
.mini .sbar{height:34px}
.mini .sbar i{font-size:13.5px;line-height:1.05;text-align:center;padding:0 2px}
.mini .cap2{font-size:14.5px;color:var(--navy);font-weight:700;margin-top:3px}
.sleg{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:13.5px;color:var(--ink);margin-top:5px}
.sleg span{display:inline-flex;align-items:center;gap:5px}
.sleg b{display:inline-block;width:13px;height:13px;border-radius:3px}
.fbt{width:100%;border-collapse:separate;border-spacing:0 4px;font-size:14.5px;line-height:1.24;margin-top:8px}

    $ov.innerHTML='<div class="scrim"></div><div class="sheetp" role="dialog" aria-label="Đã lưu khoản chi"><div class="top"><span class="gomtag"><i>GOM</i>GHI CHÚ CHI TIÊU NHANH</span><button type="button" class="x" data-act="bclose" aria-label="Đóng">'+ic('x',2.6)+'</button></div>'+
     '<div class="sdone"><div class="ck">'+ic('check',3)+'</div><b>Đã lưu 55.000đ vào '+esc(CATS[d.k].n)+'</b>'+(d.p!==null?'<div class="plabel" style="justify-content:center;gap:6px;margin-top:4px"><span>Đã dùng '+d.p+'% hạn mức '+esc(CATS[d.k].n)+' tháng này</span></div>':'')+
     (d.hot?'<div class="hotline">'+ic('warn')+'<span>Bạn vừa chi 55.000đ cho '+esc(CATS[d.k].n)+'. Bạn đã dùng '+d.p+'% hạn mức tháng này!</span></div>':'')+'</div>'+
     '<div class="sbtns"><button type="button" class="btn-l" data-act="bclose">Đóng</button><button type="button" class="btn-k" data-act="gomopen">Mở GOM</button></div></div>';
    return;}
  var cats=['cafe','food','shop','move'].map(function(k){return '<button type="button" class="cat'+(S.pick===k?' on':'')+'" data-act="pick" data-v="'+k+'" aria-pressed="'+(S.pick===k)+'">'+ic(CATS[k].ic)+esc(CATS[k].n)+(k==='cafe'?'<span class="sg">Gợi ý</span>':'')+'</button>';}).join('');
  $ov.innerHTML='<div class="scrim" data-act="close"></div><div class="sheetp" role="dialog" aria-label="Ghi chú chi tiêu nhanh"><div class="top"><span class="gomtag">'+(S.sheet==='bankc'?'<i>GOM</i>':'')+'GHI CHÚ CHI TIÊU NHANH</span><button type="button" class="x" data-act="close" aria-label="Đóng">'+ic('x',2.6)+'</button></div><div class="mer">MAKE ROOM CAFE</div><div class="amt">55.000đ</div><div class="src">'+(S.sheet==='qr'?'Từ quét mã QR · 13:23 22/09':S.sheet==='pend'?'Khoản chưa phân loại · 13:23 22/09':S.sheet==='bankc'?'Vừa chuyển khoản thành công · 13:23 22/09':'Biến động số dư · 13:23 22/09')+' · mô phỏng</div><div class="cats">'+cats+'</div><input class="note-in" id="note" placeholder="Thêm ghi chú (tùy chọn)…" aria-label="Ghi chú" maxlength="60"><div class="sbtns">'+(S.sheet==='pend'?'':'<button type="button" class="btn-l" data-act="later">Để sau</button>')+'<button type="button" class="btn-k" data-act="save">Lưu nhanh</button></div></div>';
}
function render(keepScroll){
  var y=keepScroll?$view.scrollTop:0;
  $view.innerHTML=V[S.screen]();
  $view.scrollTop=y;
  renderTab();renderBanner();renderOverlay();
  $toast.innerHTML=S.toast?'<div class="toast" role="status">'+esc(S.toast)+'</div>':'';
}
function say(m){S.toast=m;clearTimeout(tt);tt=setTimeout(function(){S.toast='';$toast.innerHTML='';},2600);}
function save(){
  var k=S.pick,note=(document.getElementById('note')||{}).value||'';
  if(S.sheet==='pend'){S.spent.none=Math.max(0,S.spent.none-55000);S.tx=S.tx.filter(function(x){return !x.pend;});}
  S.spent[k]+=55000;
  S.tx.unshift({t:'MAKE ROOM CAFE',c:k,a:-55000,w:CATS[k].n+(note?' · '+note:'')+' · 13:23 22/09'});
  if(S.sheet==='bankc'){var l2=S.limits[k];S.sheetDone={k:k,p:l2?pct(S.spent[k],l2):null,hot:!!(l2&&S.spent[k]/l2>=0.85)};render(true);return;}
  S.sheet=null;S.screen='home';S.banner=null;
  var lim=S.limits[k];
  if(lim&&S.spent[k]/lim>=0.85){S.banner={k:'alert',msg:'Bạn vừa chi 55.000đ cho '+CATS[k].n+'. Bạn đã dùng '+pct(S.spent[k],lim)+'% hạn mức tháng này!'};}
  say('Đã lưu 55.000đ vào '+CATS[k].n);
  render();
}
function act(a,v){
  if(a==='go'){S.screen=v;S.banner=S.banner&&S.banner.k==='alert'?null:S.banner;render();}
  else if(a==='tip'){say('Mẹo: ghi khoản chi ngay khi vừa trả để không bỏ sót khoản nhỏ.');render(true);}
  else if(a==='scan'){S.scanning=true;render(true);setTimeout(function(){S.scanning=false;S.sheet='qr';S.pick='cafe';render(true);},800);}
  else if(a==='openbank'){S.banner=null;S.sheet='bank';S.pick='cafe';render(true);}
  else if(a==='alertgo'){S.banner=null;S.screen='stats';render();}
  else if(a==='pick'){S.pick=v;renderOverlay();}
  else if(a==='close'){S.sheet=null;renderOverlay();}
  else if(a==='save'){save();}
  else if(a==='later'){var fromBank=S.sheet==='bankc';S.spent.none+=55000;S.tx.unshift({t:'MAKE ROOM CAFE',c:'none',a:-55000,w:'Chưa phân loại · chạm để phân loại',pend:true});S.sheet=null;if(!fromBank){S.screen='home';}S.banner=null;say(fromBank?'GOM đã để 55.000đ vào mục Chưa phân loại':'Đã để 55.000đ vào mục Chưa phân loại');render(fromBank);}
  else if(a==='bpay'){S.bstep='busy';render(true);setTimeout(function(){S.bstep='done';render(true);setTimeout(function(){if(S.screen==='bank'&&S.bstep==='done'&&!S.sheet&&!S.bankShown){S.bankShown=true;S.sheet='bankc';S.pick='cafe';S.sheetDone=null;render(true);}},900);},700);}
  else if(a==='bnew'){S.bstep='form';S.sheet=null;S.sheetDone=null;S.bankShown=false;render();}
  else if(a==='bclose'){S.sheet=null;S.sheetDone=null;render(true);}
  else if(a==='gomopen'){S.sheet=null;S.sheetDone=null;S.screen='home';render();}
  else if(a==='sortpend'){S.sheet='pend';S.pick='cafe';render(true);}
  else if(a==='gcat'){
    var DEF={food:'Hạn mức tiền ăn tháng này',shop:'Hạn mức mua sắm tháng này',tech:'Tiết kiệm mua laptop mới',rent:'Để dành tiền nhà',other:'Mục tiêu tiết kiệm'};
    var isDef=Object.keys(DEF).some(function(k){return DEF[k]===S.goalName;});
    S.goalCat=v;if(isDef)S.goalName=DEF[v];
    if((v==='food'||v==='shop')&&S.goalCap>3000000)S.goalCap=1000000;
    if(!(v==='food'||v==='shop')&&S.goalCap<500000)S.goalCap=15000000;
    render(true);}
  else if(a==='mkgoal'){
    var n=(S.goalName||'').trim()||'Mục tiêu mới',lim=(S.goalCat==='food'||S.goalCat==='shop');
    var cap=Math.max(S.goalCap,lim?50000:500000);
    S.goals.unshift({n:n,c:S.goalCat,cap:cap,saved:0});
    if(lim){S.limits[S.goalCat]=cap;}
    S.screen='goals';say(lim?'Đã đặt hạn mức '+CATS[S.goalCat].n+': '+vnd(cap):'Đã tạo mục tiêu “'+n+'”');render();
  }
  else if(a==='gadd'){var g=S.goals[+v];g.saved=Math.min(g.cap,g.saved+200000);render(true);}
  else if(a==='chal'){S.chal=Math.min(7,S.chal+1);if(S.chal===7){S.chalDone=true;S.xu+=50;say('Hoàn thành thử thách, +50 Xu');}render(true);}
  else if(a==='redeem'){var x=GIFTS[+v];if(S.xu>=x.xu&&!S.redeemed[v]){S.xu-=x.xu;S.redeemed[v]=true;say('Đã đổi “'+x.n+'”');}render(true);}
}
var $screen=document.getElementById('screen');
$screen.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||b.hasAttribute('disabled'))return;
  act(b.getAttribute('data-act'),b.getAttribute('data-v'));
});
$screen.addEventListener('input',function(e){
  if(e.target.id==='gname'){S.goalName=e.target.value;}
  else if(e.target.id==='gcap'){S.goalCap=+e.target.value;var b=document.getElementById('gbub'),mx=+e.target.max;b.textContent=vnd(S.goalCap);b.style.left=(S.goalCap/mx*100)+'%';}
});


/* A/B variant */
function setAB(v){
  window.__ab=v;S.variant=v;
  document.querySelectorAll('[data-ab]').forEach(function(b){var on=b.getAttribute('data-ab')===v;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);});
  if(v==='C'){S.screen='bank';S.bstep='form';S.sheet=null;S.sheetDone=null;S.bankShown=false;}
  else if(S.screen!=='home'){S.screen='home';}
  render();
}
document.querySelectorAll('[data-ab]').forEach(function(b){b.addEventListener('click',function(){setAB(b.getAttribute('data-ab'));});});

/* six AI-generated interface images + Mẫu C on the poster: each opens the live prototype at that screen */
function showTask(){}
var task=null;

/* ---------- full-screen prototype ---------- */



var HINT={
 A:'<b>Mẫu A</b> · trang chủ hiện % ngân sách đã chi. Bấm <b>Ngân hàng trừ 55.000đ</b> → chạm thông báo → chọn danh mục → <b>Lưu</b>.',
 B:'<b>Mẫu B</b> · trang chủ hiện số tiền hôm nay còn tiêu được. Bấm <b>Ngân hàng trừ 55.000đ</b> → chạm thông báo → chọn danh mục → <b>Lưu</b>.',
 C:'<b>Mẫu C</b> · trong app ngân hàng, bấm <b>Chuyển tiền</b>; bảng ghi chú nhanh của GOM bật lên ngay sau khi chuyển thành công.'
};
function hint(){document.getElementById('fsTask').innerHTML=HINT[S.variant||'A'];}
var _setAB=setAB;setAB=function(v){window.__ab=v;S=initial();S.variant=v;if(v!=='C'){S.banner={k:'bank'};}_setAB(v);hint();};
document.querySelectorAll('[data-ab]').forEach(function(b){b.addEventListener('click',hint);});
function openFs(){fitFs();}
function bank(){if(S.variant==='C'){window.__ab='A';S=initial();_setAB('A');}S.sheet=null;S.sheetDone=null;S.screen='home';S.banner={k:'bank'};render();hint();}
function reset(){var v=S.variant;S=initial();S.variant=v;if(v==='C'){S.screen='bank';}render();hint();}
function fitFs(){
  var avail=window.innerHeight-(document.getElementById('fsbox').getBoundingClientRect().top+window.scrollY)-20,
      w=window.innerWidth-32,s=Math.min(1.25,avail/716,w/350);s=Math.max(s,.62);
  $fsbox.style.width=(350*s)+'px';$fsbox.style.height=(716*s)+'px';$phone.style.transform='scale('+s+')';
}
var $phone=document.getElementById('phone'),$fsbox=document.getElementById('fsbox');
document.getElementById('fsSim').addEventListener('click',bank);
document.getElementById('fsReset').addEventListener('click',reset);
window.addEventListener('resize',fitFs);
S.banner={k:'bank'};render();hint();fitFs();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitFs);

})();
